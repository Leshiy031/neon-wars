<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#080b19" />
<title>Neon Wars — Combat Prototype</title>
<style>
:root{--bg:#070915;--panel:#11162a;--cyan:#2ff3ff;--pink:#ff3cab;--violet:#8b5cff;--text:#f5f7ff;--muted:#8d98b8;--good:#7dffb2;--bad:#ff637d;--gold:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 0%,#19214b 0,#090b19 42%,#05060d 100%);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);touch-action:none}
button{font:inherit;color:inherit}
#app{width:100%;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.topbar{height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 10px;background:linear-gradient(180deg,rgba(22,29,58,.95),rgba(10,14,31,.93));border:1px solid rgba(72,243,255,.22);border-radius:12px;box-shadow:0 0 25px rgba(47,243,255,.08)}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}.brand b{font-size:16px;letter-spacing:1.4px}.brand span{font-size:10px;color:var(--cyan);letter-spacing:1px}
.stats{display:flex;gap:8px;font-size:12px;align-items:center}.pill{padding:6px 9px;border-radius:999px;background:#0a1024;border:1px solid rgba(255,255,255,.08);white-space:nowrap}.pill strong{color:var(--gold)}
#battleWrap{min-height:0;position:relative;border-radius:16px;overflow:hidden;border:1px solid rgba(139,92,255,.3);background:#050711;box-shadow:0 0 35px rgba(139,92,255,.12)}
#game{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:#050711}
.battleHUD{position:absolute;z-index:3;top:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;pointer-events:none}.timer{min-width:62px;text-align:center;font-weight:800;font-size:13px;padding:6px 10px;border-radius:10px;background:rgba(7,10,24,.78);border:1px solid rgba(255,255,255,.12)}.modeTag{font-size:10px;color:#bdc7e8;padding:5px 8px;border-radius:8px;background:rgba(7,10,24,.68);border:1px solid rgba(255,255,255,.08)}
.tip{position:absolute;z-index:3;left:10px;bottom:9px;font-size:11px;color:#b9c3e5;background:rgba(4,7,19,.74);padding:6px 9px;border-radius:8px;pointer-events:none;border:1px solid rgba(255,255,255,.07)}
.controls{min-height:106px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:stretch}.heroes{display:grid;grid-template-columns:repeat(5,minmax(78px,1fr));gap:7px;min-width:0}.heroCard{position:relative;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:linear-gradient(180deg,#17203a,#0e1327);padding:7px 7px 6px;display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto auto;column-gap:7px;align-items:center;min-width:0;overflow:hidden;cursor:pointer}.heroCard.selected{border-color:var(--cyan);box-shadow:0 0 18px rgba(47,243,255,.25)}.avatar{grid-row:1/4;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;background:#0a1022;border:1px solid rgba(255,255,255,.1)}.heroName{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.heroRole{font-size:9px;color:var(--muted);white-space:nowrap}.lvl{font-size:9px;color:var(--gold)}
.sideControls{width:166px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.action{border:1px solid rgba(255,255,255,.12);border-radius:12px;background:linear-gradient(180deg,#1a2341,#10162c);padding:8px 9px;font-weight:800;font-size:11px;cursor:pointer;min-height:44px}.action:active{transform:translateY(1px)}.action.primary{grid-column:1/3;background:linear-gradient(135deg,#1bcada,#7853ff);border-color:#71f6ff;color:white;box-shadow:0 0 20px rgba(47,243,255,.18);font-size:13px}.action.upgrade{background:linear-gradient(180deg,#352041,#17152d);border-color:rgba(255,60,171,.3)}.action:disabled{opacity:.45;filter:saturate(.5)}
#rotate{display:none;position:fixed;z-index:50;inset:0;background:#060812;color:white;align-items:center;justify-content:center;text-align:center;padding:30px}.rotateCard{max-width:360px}.phone{font-size:52px;display:block;transform:rotate(90deg);margin:0 auto 22px}.rotateCard b{font-size:22px}.rotateCard p{color:#9ca8ca;font-size:14px;line-height:1.4}
.modal{position:absolute;z-index:20;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,5,13,.74);backdrop-filter:blur(4px)}.modal.show{display:flex}.modalCard{width:min(420px,80vw);border-radius:18px;padding:18px;background:linear-gradient(180deg,#182344,#0c1125);border:1px solid rgba(47,243,255,.28);box-shadow:0 0 45px rgba(47,243,255,.13);text-align:center}.resultTitle{font-size:25px;font-weight:900;letter-spacing:1px;margin-bottom:5px}.resultTitle.win{color:var(--good)}.resultTitle.loss{color:var(--bad)}.reward{font-size:13px;color:#c5ccec;margin-bottom:14px}.modalActions{display:flex;gap:8px;justify-content:center}.modalActions button{border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px 18px;background:#17203a;font-weight:800}.modalActions .next{background:linear-gradient(135deg,#1bcada,#7853ff)}
.toast{position:absolute;z-index:30;left:50%;top:52px;transform:translateX(-50%) translateY(-8px);opacity:0;transition:.2s;pointer-events:none;background:rgba(7,10,24,.92);border:1px solid rgba(47,243,255,.25);border-radius:9px;padding:7px 11px;font-size:11px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-height:520px){.topbar{height:36px}.controls{min-height:86px}.heroCard{padding:4px}.avatar{width:29px;height:29px}.sideControls{width:150px}.action{min-height:36px;padding:5px}.tip{font-size:9px}.heroes{gap:5px}}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand"><b>NEON WARS</b><span>COMBAT PROTOTYPE</span></div>
    <div class="stats"><div class="pill">STAGE <strong id="stageText">1</strong></div><div class="pill">CREDITS <strong id="creditsText">0</strong></div><div class="pill">POWER <strong id="powerText">0</strong></div></div>
  </div>
  <div id="battleWrap">
    <canvas id="game"></canvas>
    <div class="battleHUD"><div class="modeTag" id="modeTag">FORMATION</div><div class="timer" id="timerText">READY</div></div>
    <div class="tip" id="tipText">Тапни героя на поле, затем второго — они поменяются местами.</div>
    <div class="toast" id="toast"></div>
    <div class="modal" id="resultModal"><div class="modalCard"><div id="resultTitle" class="resultTitle">ПОБЕДА</div><div class="reward" id="resultReward"></div><div class="modalActions"><button id="retryBtn">Повторить</button><button id="nextBtn" class="next">Дальше</button></div></div></div>
  </div>
  <div class="controls"><div class="heroes" id="heroCards"></div><div class="sideControls"><button class="action upgrade" id="upgradeBtn">УЛУЧШИТЬ</button><button class="action" id="fullscreenBtn">FULLSCREEN</button><button class="action primary" id="startBtn">НАЧАТЬ БОЙ</button></div></div>
</div>
<div id="rotate"><div class="rotateCard"><span class="phone">▯</span><b>Поверни телефон горизонтально</b><p>Neon Wars проектируется как landscape-игра.</p></div></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),wrap=document.getElementById('battleWrap');
const els={stage:document.getElementById('stageText'),credits:document.getElementById('creditsText'),power:document.getElementById('powerText'),timer:document.getElementById('timerText'),mode:document.getElementById('modeTag'),tip:document.getElementById('tipText'),cards:document.getElementById('heroCards'),upgrade:document.getElementById('upgradeBtn'),start:document.getElementById('startBtn'),fs:document.getElementById('fullscreenBtn'),modal:document.getElementById('resultModal'),resultTitle:document.getElementById('resultTitle'),resultReward:document.getElementById('resultReward'),retry:document.getElementById('retryBtn'),next:document.getElementById('nextBtn'),toast:document.getElementById('toast')};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),saveKey='neonWarsProto_v1';
const defaultSave={stage:1,credits:600,levels:{axel:1,nova:1,bolt:1,vera:1,blade:1},formation:['axel','nova','bolt','vera','blade']};
let save;try{save=Object.assign({},defaultSave,JSON.parse(localStorage.getItem(saveKey)||'{}'));save.levels=Object.assign({},defaultSave.levels,save.levels||{});if(!Array.isArray(save.formation)||save.formation.length!==5)save.formation=[...defaultSave.formation];}catch(e){save=JSON.parse(JSON.stringify(defaultSave));}
const heroDefs={axel:{name:'AXEL',role:'Tank',icon:'🛡️',color:'#2ff3ff',hp:1080,atk:86,def:38,spd:.92},nova:{name:'NOVA',role:'Mage',icon:'✦',color:'#b46cff',hp:650,atk:132,def:14,spd:1.02},bolt:{name:'BOLT',role:'Ranger',icon:'⌁',color:'#ffd166',hp:710,atk:116,def:18,spd:1.28},vera:{name:'VERA',role:'Support',icon:'✚',color:'#6dffb0',hp:740,atk:74,def:20,spd:1.05},blade:{name:'BLADE',role:'Assassin',icon:'◆',color:'#ff3cab',hp:690,atk:145,def:15,spd:1.22}};
let W=1,H=1,dpr=1,state='prep',selectedHero=null,units=[],particles=[],floaters=[],battleTime=60,last=performance.now(),shake=0,resultShown=false;
function persist(){localStorage.setItem(saveKey,JSON.stringify(save));}
function levelMult(id){return 1+(save.levels[id]-1)*.09;}
function heroPower(id){const d=heroDefs[id],lv=save.levels[id];return Math.round((d.hp*.2+d.atk*3+d.def*5)*(1+(lv-1)*.09));}
function teamPower(){return Object.keys(heroDefs).reduce((s,id)=>s+heroPower(id),0);}
function upgradeCost(id){return 120+save.levels[id]*90;}
function toast(text){els.toast.textContent=text;els.toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>els.toast.classList.remove('show'),1500);}
function slot(side,i){const front=i<2;const ys=front?[.35,.70]:[.18,.50,.82];const yi=front?i:i-2;return{x:side==='p'?(front?W*.36:W*.18):(front?W*.64:W*.82),y:H*ys[yi],front};}
function resizeCanvas(){const r=wrap.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(window.devicePixelRatio||1,1.6);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;for(const u of units){const s=slot(u.side,u.slot);u.x=u.baseX=s.x;u.y=u.baseY=s.y;}}
class Unit{constructor(o){Object.assign(this,o);this.maxHp=o.hp;this.hp=o.hp;this.shield=0;this.energy=0;this.attackCd=rand(.15,.5);this.skillCd=rand(2.5,4.3);this.dead=false;this.hitFlash=0;this.anim=rand(0,10);this.ultFlash=0;this.taunt=0;}}
function buildPlayerUnits(){return save.formation.map((id,i)=>{const d=heroDefs[id],m=levelMult(id),s=slot('p',i);return new Unit({id,name:d.name,role:d.role,color:d.color,side:'p',slot:i,x:s.x,y:s.y,baseX:s.x,baseY:s.y,hp:d.hp*m,atk:d.atk*m,def:d.def*m,spd:d.spd});});}
function enemyDefs(){const m=1+(save.stage-1)*.07;return [{id:'riot',name:'RIOT',role:'Tank',color:'#ff7b72',hp:980*m,atk:77*m,def:34*m,spd:.88},{id:'raze',name:'RAZE',role:'Fighter',color:'#ff9d4d',hp:820*m,atk:104*m,def:23*m,spd:1.02},{id:'hex',name:'HEX',role:'Ranger',color:'#ff5c9d',hp:590*m,atk:125*m,def:12*m,spd:1.1},{id:'null',name:'NULL',role:'Mage',color:'#a968ff',hp:610*m,atk:118*m,def:14*m,spd:1},{id:'wraith',name:'WRAITH',role:'Assassin',color:'#ff355d',hp:640*m,atk:136*m,def:13*m,spd:1.22}];}
function buildEnemyUnits(){return enemyDefs().map((d,i)=>{const s=slot('e',i);return new Unit({...d,side:'e',slot:i,x:s.x,y:s.y,baseX:s.x,baseY:s.y});});}
function resetUnits(){units=[...buildPlayerUnits(),...buildEnemyUnits()];}
function renderCards(){els.cards.innerHTML='';Object.entries(heroDefs).forEach(([id,d])=>{const b=document.createElement('button');b.className='heroCard'+(selectedHero===id?' selected':'');b.innerHTML=`<div class="avatar" style="color:${d.color};box-shadow:inset 0 0 14px ${d.color}22">${d.icon}</div><div class="heroName">${d.name}</div><div class="heroRole">${d.role}</div><div class="lvl">LV.${save.levels[id]} · ${heroPower(id)} PWR</div>`;b.addEventListener('pointerup',e=>{e.preventDefault();if(state!=='prep')return;selectedHero=id;renderCards();toast('Герой выбран. Тапни второго героя на поле.');});els.cards.appendChild(b);});const c=upgradeCost(selectedHero||'axel');els.upgrade.textContent=selectedHero?`УЛУЧШИТЬ ${heroDefs[selectedHero].name} · ${c}`:'УЛУЧШИТЬ';els.upgrade.disabled=!selectedHero||save.credits<c||state!=='prep';}
function updateHUD(){els.stage.textContent=save.stage;els.credits.textContent=Math.floor(save.credits);els.power.textContent=teamPower();renderCards();}
function resetPrep(){state='prep';selectedHero=null;resultShown=false;battleTime=60;particles=[];floaters=[];resetUnits();els.timer.textContent='READY';els.mode.textContent='FORMATION';els.tip.textContent='Тапни героя на поле, затем второго — они поменяются местами.';els.start.disabled=false;els.modal.classList.remove('show');updateHUD();}
function living(side){return units.filter(u=>u.side===side&&!u.dead);}
function chooseTarget(u){const es=living(u.side==='p'?'e':'p');if(!es.length)return null;if(u.role==='Assassin'){const back=es.filter(e=>!slot(e.side,e.slot).front);return (back.length?back:es).slice().sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];}if(u.role==='Ranger'||u.role==='Mage')return es.slice().sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];return es.slice().sort((a,b)=>Math.hypot(u.x-a.x,u.y-a.y)-Math.hypot(u.x-b.x,u.y-b.y))[0];}
function burst(x,y,color,n=6){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-70,70),vy:rand(-90,40),life:rand(.25,.6),color,size:rand(2,6)});}
function damage(src,t,amount,crit=.08){if(!t||t.dead)return;const isCrit=Math.random()<crit;let dmg=amount*(isCrit?1.65:1)*(100/(100+t.def));if(t.shield>0){const s=Math.min(t.shield,dmg);t.shield-=s;dmg-=s;}if(dmg>0){t.hp-=dmg;t.energy=clamp(t.energy+8,0,100);t.hitFlash=.12;shake=Math.max(shake,isCrit?5:2);floaters.push({x:t.x,y:t.y-36,text:(isCrit?'CRIT ':'')+Math.round(dmg),color:isCrit?'#ffd166':'#fff',life:.7});}if(t.hp<=0){t.hp=0;t.dead=true;burst(t.x,t.y,t.color,12);}}
function heal(t,amount){if(!t||t.dead)return;const before=t.hp;t.hp=Math.min(t.maxHp,t.hp+amount);if(t.hp>before)floaters.push({x:t.x,y:t.y-36,text:'+'+Math.round(t.hp-before),color:'#6dffb0',life:.8});}
function basicAttack(u,t){u.attackCd=1/u.spd;u.energy=clamp(u.energy+17,0,100);u.x+=u.side==='p'?8:-8;setTimeout(()=>{if(!u.dead)u.x=u.baseX;},70);damage(u,t,u.atk,u.role==='Assassin'?.18:.08);burst(t.x,t.y,u.color,3);}
function useSkill(u){u.skillCd=4.7;const foes=living(u.side==='p'?'e':'p'),friends=living(u.side);if(!foes.length)return;if(u.side==='e'){if(u.role==='Tank')u.shield+=u.maxHp*.14;else if(u.role==='Mage')foes.slice(0,3).forEach(t=>damage(u,t,u.atk*.7));else damage(u,chooseTarget(u),u.atk*1.3,.12);return;}if(u.id==='axel'){u.shield+=u.maxHp*.22;}else if(u.id==='nova'){foes.slice().sort((a,b)=>a.hp-b.hp).slice(0,3).forEach(t=>damage(u,t,u.atk*.72));}else if(u.id==='bolt'){const t=chooseTarget(u);for(let i=0;i<3;i++)setTimeout(()=>damage(u,t,u.atk*.45,.16),i*80);}else if(u.id==='vera'){heal(friends.slice().sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0],u.atk*2.2);}else if(u.id==='blade'){damage(u,chooseTarget(u),u.atk*1.7,.28);}burst(u.x,u.y,u.color,7);}
function useUlt(u){u.energy=0;u.ultFlash=.5;shake=8;const foes=living(u.side==='p'?'e':'p'),friends=living(u.side);if(u.side==='e'){if(u.role==='Mage')foes.forEach(t=>damage(u,t,u.atk));else damage(u,chooseTarget(u),u.atk*2,.15);return;}if(u.id==='axel')friends.forEach(a=>a.shield+=a.maxHp*.18);else if(u.id==='nova')foes.forEach(t=>damage(u,t,u.atk*1.25));else if(u.id==='bolt')foes.slice(0,4).forEach((t,i)=>setTimeout(()=>damage(u,t,u.atk*.95,.2),i*70));else if(u.id==='vera')friends.forEach(a=>heal(a,u.atk*1.6));else if(u.id==='blade'){const t=foes.slice().sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];damage(u,t,u.atk*(t.hp/t.maxHp<.35?3.1:2.1),.25);}burst(u.x,u.y,u.color,16);}
function startBattle(){if(state!=='prep')return;state='battle';selectedHero=null;battleTime=60;renderCards();els.mode.textContent='AUTO BATTLE';els.tip.textContent='Бой идёт автоматически.';els.start.disabled=true;els.upgrade.disabled=true;}
function updateBattle(dt){battleTime-=dt;els.timer.textContent=Math.max(0,battleTime).toFixed(1);for(const u of units){if(u.dead)continue;u.anim+=dt;u.hitFlash=Math.max(0,u.hitFlash-dt);u.ultFlash=Math.max(0,u.ultFlash-dt);u.attackCd-=dt;u.skillCd-=dt;if(u.energy>=100)useUlt(u);else if(u.skillCd<=0)useSkill(u);else if(u.attackCd<=0){const t=chooseTarget(u);if(t)basicAttack(u,t);}}if(!living('e').length)finish(true);else if(!living('p').length||battleTime<=0)finish(false);}
function finish(win){if(resultShown)return;resultShown=true;state='result';const reward=win?120+save.stage*35:35;if(win){save.credits+=reward;save.stage++;}else save.credits+=reward;persist();setTimeout(()=>{els.resultTitle.textContent=win?'ПОБЕДА':'ПОРАЖЕНИЕ';els.resultTitle.className='resultTitle '+(win?'win':'loss');els.resultReward.textContent=win?`+${reward} Credits · открыт Stage ${save.stage}`:`+${reward} Credits · измени расстановку или усили героя`;els.next.style.display=win?'inline-block':'none';els.modal.classList.add('show');updateHUD();},350);}
function drawBackground(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#111936');g.addColorStop(.48,'#080d20');g.addColorStop(1,'#060712');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.2;for(let x=0,i=0;x<W+80;x+=70,i++){const bh=H*(.25+(i%5)*.06);ctx.fillStyle=i%3===0?'#263b7a':'#151f48';ctx.fillRect(x,H*.36-bh,50,bh);if(i%2===0){ctx.fillStyle=i%4===0?'#2ff3ff':'#ff3cab';ctx.fillRect(x+12,H*.16,4,13);}}ctx.globalAlpha=1;const floor=ctx.createLinearGradient(0,H*.38,0,H);floor.addColorStop(0,'rgba(22,27,55,.65)');floor.addColorStop(1,'rgba(5,7,16,.96)');ctx.fillStyle=floor;ctx.fillRect(0,H*.38,W,H*.62);ctx.strokeStyle='rgba(47,243,255,.08)';ctx.lineWidth=1;for(let y=H*.45;y<H;y+=Math.max(24,H*.13)){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}for(let x=-W*.2;x<W*1.2;x+=Math.max(70,W*.07)){ctx.beginPath();ctx.moveTo(W/2,H*.38);ctx.lineTo(x,H);ctx.stroke();}ctx.font=`700 ${Math.max(9,H*.045)}px system-ui`;ctx.fillStyle='rgba(47,243,255,.66)';ctx.textAlign='left';ctx.fillText('YOUR SQUAD',12,H*.49);ctx.textAlign='right';ctx.fillStyle='rgba(255,90,150,.66)';ctx.fillText('HOSTILES',W-12,H*.49);}
function drawUnit(u){const scale=clamp(H/320,.55,1.05),bob=Math.sin(u.anim*3+u.slot)*2*scale,x=u.x,y=u.y+bob,selected=state==='prep'&&u.side==='p'&&selectedHero===u.id;if(selected){ctx.strokeStyle='#2ff3ff';ctx.lineWidth=3;ctx.shadowColor='#2ff3ff';ctx.shadowBlur=16;ctx.beginPath();ctx.ellipse(x,y+28*scale,40*scale,16*scale,0,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;}if(u.dead)ctx.globalAlpha=.22;ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,y+30*scale,31*scale,10*scale,0,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(x,y);if(u.side==='e')ctx.scale(-1,1);ctx.shadowColor=u.color;ctx.shadowBlur=u.ultFlash>0?25:7;ctx.fillStyle=u.hitFlash>0?'#fff':'#0c1122';ctx.fillRect(-16*scale,-28*scale,32*scale,42*scale);ctx.fillStyle=u.hitFlash>0?'#fff':u.color;ctx.fillRect(-13*scale,-36*scale,26*scale,17*scale);ctx.fillRect(-21*scale,-14*scale,8*scale,22*scale);ctx.fillRect(13*scale,-14*scale,8*scale,22*scale);ctx.fillStyle='#151a2e';ctx.fillRect(-14*scale,14*scale,10*scale,20*scale);ctx.fillRect(4*scale,14*scale,10*scale,20*scale);ctx.restore();ctx.shadowBlur=0;const bw=56*scale,bx=x-bw/2,by=y-53*scale;ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(bx,by,bw,6*scale);ctx.fillStyle=u.side==='p'?'#65ff9f':'#ff5f79';ctx.fillRect(bx+1,by+1,(bw-2)*clamp(u.hp/u.maxHp,0,1),Math.max(2,4*scale));ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(bx,by+8*scale,bw,4*scale);ctx.fillStyle=u.side==='p'?'#7a72ff':'#ff9d4d';ctx.fillRect(bx,by+8*scale,bw*clamp(u.energy/100,0,1),4*scale);ctx.font=`800 ${Math.max(8,9*scale)}px system-ui`;ctx.textAlign='center';ctx.fillStyle='#eaf0ff';ctx.fillText(u.name,x,by-3);ctx.globalAlpha=1;}
function drawEffects(){for(const p of particles){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size);p.x+=p.vx*.016;p.y+=p.vy*.016;p.vy+=160*.016;p.life-=.016;}particles=particles.filter(p=>p.life>0);ctx.font='800 12px system-ui';ctx.textAlign='center';for(const f of floaters){ctx.globalAlpha=clamp(f.life*1.7,0,1);ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);f.y-=.5;f.life-=.016;}floaters=floaters.filter(f=>f.life>0);ctx.globalAlpha=1;}
function draw(){ctx.save();if(shake>0){ctx.translate(rand(-shake,shake),rand(-shake,shake));shake=Math.max(0,shake-.6);}drawBackground();for(const u of units.filter(x=>x.side==='e'))drawUnit(u);for(const u of units.filter(x=>x.side==='p'))drawUnit(u);drawEffects();ctx.restore();}
function tick(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(state==='battle')updateBattle(dt);draw();requestAnimationFrame(tick);}
function swapWith(hit){if(!selectedHero){selectedHero=hit.id;renderCards();toast(`${hit.name} выбран. Тапни второго героя.`);return;}if(hit.id===selectedHero){selectedHero=null;renderCards();return;}const a=save.formation.indexOf(selectedHero),b=save.formation.indexOf(hit.id);if(a<0||b<0)return;[save.formation[a],save.formation[b]]=[save.formation[b],save.formation[a]];persist();selectedHero=null;resetUnits();renderCards();toast('Позиции изменены');}
canvas.addEventListener('pointerup',ev=>{if(state!=='prep')return;ev.preventDefault();const r=canvas.getBoundingClientRect(),px=ev.clientX-r.left,py=ev.clientY-r.top,hitRadius=Math.max(38,H*.18);const players=units.filter(u=>u.side==='p');let hit=null,best=Infinity;for(const u of players){const d=Math.hypot(px-u.x,py-u.y);if(d<hitRadius&&d<best){best=d;hit=u;}}if(hit)swapWith(hit);else toast('Тапни прямо по герою');});
els.start.addEventListener('pointerup',e=>{e.preventDefault();startBattle();});
els.upgrade.addEventListener('pointerup',e=>{e.preventDefault();if(!selectedHero||state!=='prep')return;const c=upgradeCost(selectedHero);if(save.credits<c){toast('Недостаточно Credits');return;}save.credits-=c;save.levels[selectedHero]++;persist();resetUnits();updateHUD();toast(`${heroDefs[selectedHero].name} повышен до LV.${save.levels[selectedHero]}`);});
els.retry.addEventListener('pointerup',e=>{e.preventDefault();resetPrep();});els.next.addEventListener('pointerup',e=>{e.preventDefault();resetPrep();});
els.fs.addEventListener('pointerup',async e=>{e.preventDefault();try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch(err){toast('Fullscreen недоступен в этом браузере');}});
window.addEventListener('resize',()=>{resizeCanvas();last=performance.now();});document.addEventListener('visibilitychange',()=>{last=performance.now();});
resizeCanvas();resetPrep();requestAnimationFrame(tick);
})();
</script>
</body>
