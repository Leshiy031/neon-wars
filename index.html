<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#080b19" />
  <title>Neon Wars — Combat Prototype</title>
  <style>
    :root{--bg:#070915;--panel:#11162a;--cyan:#2ff3ff;--pink:#ff3cab;--violet:#8b5cff;--text:#f5f7ff;--muted:#8d98b8;--good:#7dffb2;--bad:#ff637d;--gold:#ffd166}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 0%,#19214b 0,#090b19 42%,#05060d 100%);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);touch-action:none}button{font:inherit;color:inherit}
    #app{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.topbar{height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 10px;background:linear-gradient(180deg,rgba(22,29,58,.95),rgba(10,14,31,.93));border:1px solid rgba(72,243,255,.22);border-radius:12px;box-shadow:0 0 25px rgba(47,243,255,.08)}.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}.brand b{font-size:16px;letter-spacing:1.4px}.brand span{font-size:10px;color:var(--cyan);letter-spacing:1px}.stats{display:flex;gap:8px;font-size:12px;align-items:center}.pill{padding:6px 9px;border-radius:999px;background:#0a1024;border:1px solid rgba(255,255,255,.08);white-space:nowrap}.pill strong{color:var(--gold)}
    #battleWrap{min-height:0;position:relative;display:flex;align-items:center;justify-content:center;border-radius:16px;overflow:hidden;border:1px solid rgba(139,92,255,.3);background:#050711;box-shadow:0 0 35px rgba(139,92,255,.12)}#game{display:block;width:100%;height:100%;object-fit:contain;touch-action:none;background:#050711}.battleHUD{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;pointer-events:none}.timer{min-width:62px;text-align:center;font-weight:800;font-size:13px;padding:6px 10px;border-radius:10px;background:rgba(7,10,24,.78);border:1px solid rgba(255,255,255,.12)}.modeTag{font-size:10px;color:#bdc7e8;padding:5px 8px;border-radius:8px;background:rgba(7,10,24,.68);border:1px solid rgba(255,255,255,.08)}.tip{position:absolute;left:10px;bottom:9px;font-size:11px;color:#b9c3e5;background:rgba(4,7,19,.74);padding:6px 9px;border-radius:8px;pointer-events:none;border:1px solid rgba(255,255,255,.07)}
    .controls{min-height:106px;display:grid;grid-template-columns:1fr auto;gap:9px;align-items:stretch}.heroes{display:grid;grid-template-columns:repeat(5,minmax(78px,1fr));gap:7px;min-width:0}.heroCard{position:relative;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:linear-gradient(180deg,#17203a,#0e1327);padding:7px 7px 6px;display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto auto;column-gap:7px;align-items:center;min-width:0;overflow:hidden;cursor:pointer}.heroCard.selected{border-color:var(--cyan);box-shadow:0 0 18px rgba(47,243,255,.2)}.avatar{grid-row:1/4;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;background:#0a1022;border:1px solid rgba(255,255,255,.1)}.heroName{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.heroRole{font-size:9px;color:var(--muted);white-space:nowrap}.lvl{font-size:9px;color:var(--gold)}.sideControls{width:166px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.action{border:1px solid rgba(255,255,255,.12);border-radius:12px;background:linear-gradient(180deg,#1a2341,#10162c);padding:8px 9px;font-weight:800;font-size:11px;cursor:pointer;min-height:44px}.action:active{transform:translateY(1px)}.action.primary{grid-column:1/3;background:linear-gradient(135deg,#1bcada,#7853ff);border-color:#71f6ff;color:white;box-shadow:0 0 20px rgba(47,243,255,.18);font-size:13px}.action.upgrade{background:linear-gradient(180deg,#352041,#17152d);border-color:rgba(255,60,171,.3)}.action:disabled{opacity:.45;filter:saturate(.5)}
    #rotate{display:none;position:fixed;z-index:50;inset:0;background:#060812;color:white;align-items:center;justify-content:center;text-align:center;padding:30px}.rotateCard{max-width:360px}.phone{font-size:52px;display:block;transform:rotate(90deg);margin:0 auto 22px}.rotateCard b{font-size:22px}.rotateCard p{color:#9ca8ca;font-size:14px;line-height:1.4}.modal{position:absolute;z-index:20;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,5,13,.74);backdrop-filter:blur(4px)}.modal.show{display:flex}.modalCard{width:min(420px,80vw);border-radius:18px;padding:18px;background:linear-gradient(180deg,#182344,#0c1125);border:1px solid rgba(47,243,255,.28);box-shadow:0 0 45px rgba(47,243,255,.13);text-align:center}.resultTitle{font-size:25px;font-weight:900;letter-spacing:1px;margin-bottom:5px}.resultTitle.win{color:var(--good)}.resultTitle.loss{color:var(--bad)}.reward{font-size:13px;color:#c5ccec;margin-bottom:14px}.modalActions{display:flex;gap:8px;justify-content:center}.modalActions button{border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px 18px;background:#17203a;font-weight:800}.modalActions .next{background:linear-gradient(135deg,#1bcada,#7853ff)}.toast{position:absolute;z-index:30;left:50%;top:52px;transform:translateX(-50%) translateY(-8px);opacity:0;transition:.2s;pointer-events:none;background:rgba(7,10,24,.92);border:1px solid rgba(47,243,255,.25);border-radius:9px;padding:7px 11px;font-size:11px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media (max-height:520px){.topbar{height:36px}.controls{min-height:86px}.heroCard{padding:4px}.avatar{width:29px;height:29px}.sideControls{width:150px}.action{min-height:36px;padding:5px}.tip{font-size:9px}.heroes{gap:5px}}@media (orientation:portrait){#rotate{display:flex}}
  </style>
</head>
<body>
<div id="app">
  <div class="topbar"><div class="brand"><b>NEON WARS</b><span>COMBAT PROTOTYPE</span></div><div class="stats"><div class="pill">STAGE <strong id="stageText">1</strong></div><div class="pill">CREDITS <strong id="creditsText">0</strong></div><div class="pill">POWER <strong id="powerText">0</strong></div></div></div>
  <div id="battleWrap">
    <canvas id="game" width="1280" height="720"></canvas><div class="battleHUD"><div class="modeTag" id="modeTag">FORMATION</div><div class="timer" id="timerText">READY</div></div><div class="tip" id="tipText">Тапни героя, затем другого героя на поле — они поменяются местами.</div><div class="toast" id="toast"></div>
    <div class="modal" id="resultModal"><div class="modalCard"><div id="resultTitle" class="resultTitle">ПОБЕДА</div><div class="reward" id="resultReward"></div><div class="modalActions"><button id="retryBtn">Повторить</button><button id="nextBtn" class="next">Дальше</button></div></div></div>
  </div>
  <div class="controls"><div class="heroes" id="heroCards"></div><div class="sideControls"><button class="action upgrade" id="upgradeBtn">УЛУЧШИТЬ</button><button class="action" id="fullscreenBtn">FULLSCREEN</button><button class="action primary" id="startBtn">НАЧАТЬ БОЙ</button></div></div>
</div>
<div id="rotate"><div class="rotateCard"><span class="phone">▯</span><b>Поверни телефон горизонтально</b><p>Neon Wars проектируется как landscape-игра. После поворота поле боя и управление займут весь экран.</p></div></div>
<script>
(() => {
'use strict';
const W=1280,H=720,canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const els={stage:document.getElementById('stageText'),credits:document.getElementById('creditsText'),power:document.getElementById('powerText'),timer:document.getElementById('timerText'),mode:document.getElementById('modeTag'),tip:document.getElementById('tipText'),cards:document.getElementById('heroCards'),upgrade:document.getElementById('upgradeBtn'),start:document.getElementById('startBtn'),fs:document.getElementById('fullscreenBtn'),modal:document.getElementById('resultModal'),resultTitle:document.getElementById('resultTitle'),resultReward:document.getElementById('resultReward'),retry:document.getElementById('retryBtn'),next:document.getElementById('nextBtn'),toast:document.getElementById('toast')};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),saveKey='neonWarsProto_v1',defaultSave={stage:1,credits:600,levels:{axel:1,nova:1,bolt:1,vera:1,blade:1},formation:['axel','nova','bolt','vera','blade']};
let save;try{save=Object.assign({},defaultSave,JSON.parse(localStorage.getItem(saveKey)||'{}'));save.levels=Object.assign({},defaultSave.levels,save.levels||{});if(!Array.isArray(save.formation)||save.formation.length!==5)save.formation=[...defaultSave.formation];}catch(e){save=JSON.parse(JSON.stringify(defaultSave));}
const heroDefs={axel:{name:'AXEL',role:'Tank',icon:'🛡️',color:'#2ff3ff',hp:1080,atk:86,def:38,spd:.92,range:150},nova:{name:'NOVA',role:'Mage',icon:'✦',color:'#b46cff',hp:650,atk:132,def:14,spd:1.02,range:430},bolt:{name:'BOLT',role:'Ranger',icon:'⌁',color:'#ffd166',hp:710,atk:116,def:18,spd:1.28,range:470},vera:{name:'VERA',role:'Support',icon:'✚',color:'#6dffb0',hp:740,atk:74,def:20,spd:1.05,range:410},blade:{name:'BLADE',role:'Assassin',icon:'◆',color:'#ff3cab',hp:690,atk:145,def:15,spd:1.22,range:175}};
const slotsPlayer=[{x:430,y:235,front:true},{x:430,y:485,front:true},{x:220,y:135,front:false},{x:220,y:360,front:false},{x:220,y:585,front:false}],slotsEnemy=[{x:850,y:235,front:true},{x:850,y:485,front:true},{x:1060,y:135,front:false},{x:1060,y:360,front:false},{x:1060,y:585,front:false}];
let state='prep',selectedHero=null,units=[],particles=[],floaters=[],battleTime=60,last=performance.now(),shake=0,resultShown=false;
function persist(){localStorage.setItem(saveKey,JSON.stringify(save));}function levelMult(id){return 1+(save.levels[id]-1)*.09;}function heroPower(id){const d=heroDefs[id],lv=save.levels[id];return Math.round((d.hp*.2+d.atk*3+d.def*5)*(1+(lv-1)*.09));}function teamPower(){return Object.keys(heroDefs).reduce((s,id)=>s+heroPower(id),0);}
function updateHUD(){els.stage.textContent=save.stage;els.credits.textContent=Math.floor(save.credits);els.power.textContent=teamPower();renderCards();}
function renderCards(){els.cards.innerHTML='';Object.entries(heroDefs).forEach(([id,d])=>{const b=document.createElement('button');b.className='heroCard'+(selectedHero===id?' selected':'');b.innerHTML=`<div class="avatar" style="color:${d.color};box-shadow:inset 0 0 14px ${d.color}22">${d.icon}</div><div class="heroName">${d.name}</div><div class="heroRole">${d.role}</div><div class="lvl">LV.${save.levels[id]} · ${heroPower(id)} PWR</div>`;b.addEventListener('click',()=>{if(state!=='prep')return;selectedHero=id;renderCards();toast('Теперь тапни героя на поле, чтобы поменять позиции');});els.cards.appendChild(b);});const cost=upgradeCost(selectedHero||'axel');els.upgrade.textContent=selectedHero?`УЛУЧШИТЬ ${heroDefs[selectedHero].name} · ${cost}`:'УЛУЧШИТЬ';els.upgrade.disabled=!selectedHero||save.credits<cost||state!=='prep';}
function upgradeCost(id){return 120+save.levels[id]*90;}function toast(text){els.toast.textContent=text;els.toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>els.toast.classList.remove('show'),1600);}
class Unit{constructor(opts){Object.assign(this,opts);this.x=opts.x;this.y=opts.y;this.baseX=opts.x;this.baseY=opts.y;this.maxHp=opts.hp;this.hp=opts.hp;this.shield=0;this.energy=0;this.attackCd=rand(.15,.5);this.skillCd=rand(2.5,4.3);this.dead=false;this.hitFlash=0;this.anim=rand(0,10);this.ultFlash=0;this.taunt=0;this.bonusAtk=opts.bonusAtk||1;this.bonusDef=opts.bonusDef||1;}get hpPct(){return this.hp/this.maxHp}}
function buildPlayerUnits(){return save.formation.map((id,i)=>{const d=heroDefs[id],m=levelMult(id),sl=slotsPlayer[i];let bonusAtk=1,bonusDef=1;if(sl.front&&d.role==='Tank')bonusDef=1.25;if(!sl.front&&(d.role==='Ranger'||d.role==='Mage'))bonusAtk=1.15;if(!sl.front&&d.role==='Support')bonusAtk=1.12;return new Unit({id,name:d.name,role:d.role,color:d.color,icon:d.icon,side:'p',slot:i,x:sl.x,y:sl.y,hp:d.hp*m,atk:d.atk*m,def:d.def*m,spd:d.spd,range:d.range,bonusAtk,bonusDef});});}
function enemyDefsForStage(){const s=save.stage,m=1+(s-1)*.07;return [{id:'en_tank',name:'RIOT',role:'Tank',color:'#ff7b72',hp:980*m,atk:77*m,def:34*m,spd:.88,range:150},{id:'en_fighter',name:'RAZE',role:'Fighter',color:'#ff9d4d',hp:820*m,atk:104*m,def:23*m,spd:1.02,range:170},{id:'en_sniper',name:'HEX',role:'Ranger',color:'#ff5c9d',hp:590*m,atk:125*m,def:12*m,spd:1.1,range:470},{id:'en_mage',name:'NULL',role:'Mage',color:'#a968ff',hp:610*m,atk:118*m,def:14*m,spd:1.0,range:430},{id:'en_assassin',name:'WRAITH',role:'Assassin',color:'#ff355d',hp:640*m,atk:136*m,def:13*m,spd:1.22,range:175}];}
function buildEnemyUnits(){return enemyDefsForStage().map((d,i)=>{const sl=slotsEnemy[i];return new Unit({...d,side:'e',slot:i,x:sl.x,y:sl.y,bonusAtk:1,bonusDef:sl.front&&d.role==='Tank'?1.2:1});});}
function resetPrep(){state='prep';resultShown=false;battleTime=60;units=[...buildPlayerUnits(),...buildEnemyUnits()];particles=[];floaters=[];els.timer.textContent='READY';els.mode.textContent='FORMATION';els.tip.textContent='Тапни героя, затем другого героя на поле — они поменяются местами.';els.start.disabled=false;els.modal.classList.remove('show');updateHUD();}
function startBattle(){if(state!=='prep')return;state='battle';battleTime=60;selectedHero=null;renderCards();els.mode.textContent='AUTO BATTLE';els.tip.textContent='Бой идёт автоматически. Следи за энергией и ультимейтами.';els.start.disabled=true;els.upgrade.disabled=true;}
function living(side){return units.filter(u=>u.side===side&&!u.dead);}function enemiesOf(u){return living(u.side==='p'?'e':'p');}function alliesOf(u){return living(u.side);}function slotInfo(u){return (u.side==='p'?slotsPlayer:slotsEnemy)[u.slot];}
function chooseTarget(u){const es=enemiesOf(u);if(!es.length)return null;if(u.role==='Assassin'){const back=es.filter(e=>!slotInfo(e).front),pool=back.length?back:es;return pool.slice().sort((a,b)=>a.hpPct-b.hpPct)[0];}const taunters=es.filter(e=>e.taunt>0);if(taunters.length)return taunters[0];if(u.role==='Ranger'||u.role==='Mage')return es.slice().sort((a,b)=>a.hpPct-b.hpPct)[0];return es.slice().sort((a,b)=>dist(u,a)-dist(u,b))[0];}
function damage(src,tgt,amount,critChance=.08){if(!tgt||tgt.dead)return;const crit=Math.random()<critChance;let dmg=amount*(crit?1.65:1)*(100/(100+tgt.def*tgt.bonusDef));if(tgt.shield>0){const s=Math.min(tgt.shield,dmg);tgt.shield-=s;dmg-=s;if(s>0)floaters.push({x:tgt.x,y:tgt.y-58,text:'-'+Math.round(s),color:'#63e8ff',life:.7});}if(dmg>0){tgt.hp-=dmg;tgt.energy=clamp(tgt.energy+8,0,100);tgt.hitFlash=.12;shake=Math.max(shake,crit?7:3);floaters.push({x:tgt.x+rand(-14,14),y:tgt.y-72,text:(crit?'CRIT ':'')+Math.round(dmg),color:crit?'#ffd166':'#ffffff',life:.75});}if(tgt.hp<=0){tgt.hp=0;tgt.dead=true;burst(tgt.x,tgt.y,tgt.color,15);}}
function heal(src,tgt,amount){if(!tgt||tgt.dead)return;const before=tgt.hp;tgt.hp=Math.min(tgt.maxHp,tgt.hp+amount);const v=tgt.hp-before;if(v>0)floaters.push({x:tgt.x,y:tgt.y-70,text:'+'+Math.round(v),color:'#6dffb0',life:.9});}function burst(x,y,color,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-120,120),vy:rand(-150,60),life:rand(.25,.65),color,size:rand(3,8)});}
function basicAttack(u,t){u.attackCd=1/u.spd;u.energy=clamp(u.energy+17,0,100);u.x+=(u.side==='p'?1:-1)*10;setTimeout(()=>{if(!u.dead)u.x=u.baseX;},70);let mult=1;if(u.role==='Ranger'&&!slotInfo(u).front)mult*=1.12;if(u.role==='Mage'&&!slotInfo(u).front)mult*=1.08;damage(u,t,u.atk*u.bonusAtk*mult,u.role==='Assassin'?.18:.08);if(u.role==='Tank')u.taunt=.8;burst(t.x,t.y,u.color,3);}
function useSkill(u){u.skillCd=4.8+(u.role==='Tank'?.8:0);const foes=enemiesOf(u),friends=alliesOf(u);if(!foes.length)return;if(u.side==='e'){if(u.role==='Tank'){u.shield+=u.maxHp*.14;u.taunt=1.5;burst(u.x,u.y,u.color,6);}else if(u.role==='Mage'){foes.slice().sort((a,b)=>a.hpPct-b.hpPct).slice(0,3).forEach(t=>damage(u,t,u.atk*.75));}else if(u.role==='Assassin'){damage(u,chooseTarget(u),u.atk*1.55,.2);}else{damage(u,chooseTarget(u),u.atk*1.25,.12);}return;}switch(u.id){case'axel':u.shield+=u.maxHp*.22;u.taunt=2.1;burst(u.x,u.y,u.color,10);break;case'nova':foes.slice().sort((a,b)=>a.hpPct-b.hpPct).slice(0,3).forEach(t=>damage(u,t,u.atk*.72));burst(640,360,u.color,10);break;case'bolt':{const t=chooseTarget(u);for(let i=0;i<3;i++)setTimeout(()=>damage(u,t,u.atk*.45,.16),i*90);break;}case'vera':{const t=friends.slice().sort((a,b)=>a.hpPct-b.hpPct)[0];heal(u,t,u.atk*2.2*u.bonusAtk);break;}case'blade':damage(u,chooseTarget(u),u.atk*1.7,.28);break;}}
function useUlt(u){u.energy=0;u.ultFlash=.5;shake=Math.max(shake,10);const foes=enemiesOf(u),friends=alliesOf(u);burst(u.x,u.y,u.color,18);if(u.side==='e'){const t=chooseTarget(u);if(u.role==='Mage')foes.forEach(x=>damage(u,x,u.atk));else damage(u,t,u.atk*2,.15);return;}switch(u.id){case'axel':friends.forEach(a=>a.shield+=a.maxHp*.18);break;case'nova':foes.forEach(t=>damage(u,t,u.atk*1.25));break;case'bolt':foes.slice().sort((a,b)=>a.hpPct-b.hpPct).slice(0,4).forEach((t,i)=>setTimeout(()=>damage(u,t,u.atk*.95,.2),i*80));break;case'vera':friends.forEach(a=>heal(u,a,u.atk*1.6));break;case'blade':{const t=foes.slice().sort((a,b)=>a.hpPct-b.hpPct)[0];damage(u,t,u.atk*(t.hpPct<.35?3.1:2.1),.25);break;}}}
function updateBattle(dt){battleTime-=dt;els.timer.textContent=Math.max(0,battleTime).toFixed(1);for(const u of units){if(u.dead)continue;u.anim+=dt;u.hitFlash=Math.max(0,u.hitFlash-dt);u.ultFlash=Math.max(0,u.ultFlash-dt);u.taunt=Math.max(0,u.taunt-dt);u.attackCd-=dt;u.skillCd-=dt;if(u.energy>=100){useUlt(u);continue;}if(u.skillCd<=0){useSkill(u);continue;}if(u.attackCd<=0){const t=chooseTarget(u);if(t)basicAttack(u,t);}}if(!living('e').length)finish(true);else if(!living('p').length||battleTime<=0)finish(false);}
function finish(win){if(resultShown)return;resultShown=true;state='result';const reward=win?120+save.stage*35:35;if(win){save.credits+=reward;save.stage+=1;}else save.credits+=reward;persist();setTimeout(()=>{els.resultTitle.textContent=win?'ПОБЕДА':'ПОРАЖЕНИЕ';els.resultTitle.className='resultTitle '+(win?'win':'loss');els.resultReward.textContent=win?`+${reward} Credits · открыт Stage ${save.stage}`:`+${reward} Credits · попробуй изменить расстановку или усилить героя`;els.next.style.display=win?'inline-block':'none';els.modal.classList.add('show');updateHUD();},500);}
function updateEffects(dt){particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.life-=dt;});particles=particles.filter(p=>p.life>0);floaters.forEach(f=>{f.y-=42*dt;f.life-=dt;});floaters=floaters.filter(f=>f.life>0);shake=Math.max(0,shake-30*dt);}
function drawBackground(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#121a3a');g.addColorStop(.46,'#080d21');g.addColorStop(1,'#070713');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.22;for(let i=0;i<28;i++){const x=(i*71+40)%W,h=80+(i*53)%180;ctx.fillStyle=i%3===0?'#263b7a':'#151f48';ctx.fillRect(x,140-h,52,h);if(i%2===0){ctx.fillStyle=i%4===0?'#2ff3ff':'#ff3cab';ctx.fillRect(x+10,80-h/2,5,17);ctx.fillRect(x+30,112-h/3,4,13);}}ctx.globalAlpha=1;const floor=ctx.createLinearGradient(0,300,0,H);floor.addColorStop(0,'rgba(22,27,55,.68)');floor.addColorStop(1,'rgba(5,7,16,.95)');ctx.fillStyle=floor;ctx.fillRect(0,300,W,420);ctx.strokeStyle='rgba(47,243,255,.09)';ctx.lineWidth=1;for(let y=330;y<720;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}for(let x=-200;x<1480;x+=90){ctx.beginPath();ctx.moveTo(640,300);ctx.lineTo(x,720);ctx.stroke();}ctx.font='700 15px system-ui';ctx.fillStyle='rgba(47,243,255,.7)';ctx.fillText('YOUR SQUAD',42,326);ctx.fillStyle='rgba(255,90,150,.72)';ctx.fillText('HOSTILES',1140,326);}
function drawSlot(sl,side){if(state!=='prep')return;ctx.save();ctx.setLineDash([8,8]);ctx.lineWidth=2;ctx.strokeStyle=side==='p'?'rgba(47,243,255,.24)':'rgba(255,60,130,.16)';ctx.beginPath();ctx.ellipse(sl.x,sl.y+42,61,25,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.font='10px system-ui';ctx.fillStyle='rgba(190,200,230,.34)';ctx.textAlign='center';ctx.fillText(sl.front?'FRONT':'BACK',sl.x,sl.y+79);ctx.restore();}
function drawUnit(u){const bob=Math.sin(u.anim*3+u.slot)*3,x=u.x,y=u.y+bob;if(u.dead)ctx.globalAlpha=.22;const selected=state==='prep'&&u.side==='p'&&selectedHero===u.id;if(selected){ctx.strokeStyle='#2ff3ff';ctx.lineWidth=3;ctx.shadowColor='#2ff3ff';ctx.shadowBlur=18;ctx.beginPath();ctx.ellipse(x,y+44,58,24,0,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;}ctx.fillStyle='rgba(0,0,0,.34)';ctx.beginPath();ctx.ellipse(x,y+46,44,15,0,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(x,y);if(u.side==='e')ctx.scale(-1,1);const flash=u.hitFlash>0?'#ffffff':u.color;ctx.shadowColor=u.color;ctx.shadowBlur=u.ultFlash>0?30:8;ctx.fillStyle='#0c1122';ctx.fillRect(-23,-40,46,58);ctx.fillStyle=flash;ctx.fillRect(-18,-48,36,26);ctx.fillRect(-28,-22,12,32);ctx.fillRect(16,-22,12,32);ctx.fillStyle='#151a2e';ctx.fillRect(-20,18,15,29);ctx.fillRect(5,18,15,29);ctx.fillStyle=u.color;ctx.fillRect(-13,-42,7,5);ctx.fillRect(7,-42,7,5);if(u.role==='Tank'){ctx.strokeStyle=u.color;ctx.lineWidth=6;ctx.strokeRect(28,-25,18,43);}else if(u.role==='Ranger'){ctx.strokeStyle=u.color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(29,-29);ctx.lineTo(51,-5);ctx.stroke();}else if(u.role==='Mage'){ctx.fillStyle=u.color;ctx.fillRect(28,-34,7,48);ctx.fillRect(22,-38,19,8);}else if(u.role==='Support'){ctx.strokeStyle=u.color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(31,-28);ctx.lineTo(31,18);ctx.moveTo(20,-7);ctx.lineTo(42,-7);ctx.stroke();}else if(u.role==='Assassin'){ctx.strokeStyle=u.color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(28,-22);ctx.lineTo(49,5);ctx.moveTo(48,-22);ctx.lineTo(29,5);ctx.stroke();}ctx.restore();ctx.shadowBlur=0;const barW=76,barX=x-barW/2,barY=y-77;ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(barX,barY,barW,8);ctx.fillStyle=u.side==='p'?'#65ff9f':'#ff5f79';ctx.fillRect(barX+1,barY+1,(barW-2)*clamp(u.hpPct,0,1),6);if(u.shield>0){ctx.fillStyle='#58d7ff';ctx.fillRect(barX,barY-4,barW*clamp(u.shield/u.maxHp,0,1),3);}ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect(barX,barY+11,barW,5);ctx.fillStyle=u.side==='p'?'#7a72ff':'#ff9d4d';ctx.fillRect(barX,barY+11,barW*clamp(u.energy/100,0,1),5);ctx.font='800 11px system-ui';ctx.textAlign='center';ctx.fillStyle='#eaf0ff';ctx.fillText(u.name,x,barY-6);ctx.globalAlpha=1;}
function drawEffects(){for(const p of particles){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size);}ctx.globalAlpha=1;ctx.textAlign='center';ctx.font='800 15px system-ui';for(const f of floaters){ctx.globalAlpha=clamp(f.life*1.7,0,1);ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);}ctx.globalAlpha=1;}
function draw(){ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));drawBackground();slotsPlayer.forEach(s=>drawSlot(s,'p'));slotsEnemy.forEach(s=>drawSlot(s,'e'));units.filter(u=>u.side==='e').forEach(drawUnit);units.filter(u=>u.side==='p').forEach(drawUnit);drawEffects();ctx.restore();}
function tick(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(state==='battle')updateBattle(dt);updateEffects(dt);draw();requestAnimationFrame(tick);}
function canvasPoint(ev){const r=canvas.getBoundingClientRect();return{x:(ev.clientX-r.left)*(W/r.width),y:(ev.clientY-r.top)*(H/r.height)};}
canvas.addEventListener('pointerdown',ev=>{if(state!=='prep')return;ev.preventDefault();const p=canvasPoint(ev),players=units.filter(u=>u.side==='p'),hit=players.find(u=>Math.hypot(p.x-u.x,p.y-u.y)<70);if(!hit)return;if(!selectedHero){selectedHero=hit.id;renderCards();return;}if(hit.id===selectedHero){selectedHero=null;renderCards();return;}const a=save.formation.indexOf(selectedHero),b=save.formation.indexOf(hit.id);if(a>=0&&b>=0){[save.formation[a],save.formation[b]]=[save.formation[b],save.formation[a]];persist();selectedHero=null;units=[...buildPlayerUnits(),...buildEnemyUnits()];renderCards();toast('Позиции изменены');}});
els.start.addEventListener('click',startBattle);els.upgrade.addEventListener('click',()=>{if(!selectedHero||state!=='prep')return;const c=upgradeCost(selectedHero);if(save.credits<c){toast('Недостаточно Credits');return;}save.credits-=c;save.levels[selectedHero]+=1;persist();units=[...buildPlayerUnits(),...buildEnemyUnits()];updateHUD();toast(`${heroDefs[selectedHero].name} повышен до LV.${save.levels[selectedHero]}`);});els.retry.addEventListener('click',resetPrep);els.next.addEventListener('click',resetPrep);els.fs.addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch(e){toast('Fullscreen недоступен в этом браузере');}});document.addEventListener('visibilitychange',()=>{last=performance.now();});window.addEventListener('resize',()=>{last=performance.now();});resetPrep();requestAnimationFrame(tick);
})();
</script>
</body>
